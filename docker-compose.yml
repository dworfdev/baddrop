services:
  mysql:
    image: mysql:8.0
    container_name: baddrop_mysql
    restart: always
    environment:
      MYSQL_DATABASE: baddrop_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: baddrop_app
    restart: always
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=baddrop_db
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SERVER_PORT=8080

volumes:
  mysql_data: