# =============================================================================
# PROD CONFIGURATION (Main Database: MySQL via Spring Data JPA)
# All connection & server settings are driven by environment variables
# =============================================================================
server:
  port: ${SERVER_PORT:8080}
  # Use "native" ONLY when the app sits behind your own reverse proxy (nginx/Caddy/Cloudflare) that overwrites
  # X-Forwarded-For. Without a proxy, "native" lets any client fake its IP and dodge the rate limiter.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: ${APP_NAME:baddrop}
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:baddrop_db}?createDatabaseIfNotExist=true&useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
  h2:
    console:
      enabled: false
  web:
    resources:
      cache:
        period: 0
        cachecontrol:
          no-cache: true
          no-store: true
          must-revalidate: true

slots:
  admin:
    # Admin login = username + password + TOTP code. Empty values mean admin login is DISABLED (fail-closed).
    username: ${ADMIN_USERNAME:}
    # BCrypt HASH of the admin password, not the password itself (generate with AdminCredentialsGenerator).
    password-hash: ${ADMIN_PASSWORD_HASH:}
    # Base32 TOTP secret for the authenticator app (generate with AdminCredentialsGenerator).
    totp-secret: ${ADMIN_TOTP_SECRET:}
    # Zeroing the bankroll breaks the reconciliation books. Keep false.
    allow-bankroll-reset: false
  cookie:
    secure: ${COOKIE_SECURE:true}
    # Telegram Web (iframe) needs None; native Telegram clients work with Strict/Lax. None requires secure=true.
    same-site: ${COOKIE_SAME_SITE:Strict}
  telegram:
    # Bot token from @BotFather. Empty = player login is DISABLED (fail-closed). Keep it in .env only.
    # Public link of the bot (not a secret): shown on the "outside Telegram" screen. Replace with your real bot link.
    bot-url: https://t.me/bad_drop_bot
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    max-auth-age-seconds: ${TELEGRAM_MAX_AUTH_AGE_SECONDS:3600}
  auth:
    dev-login-enabled: false
  bankroll:
    initial-prize-pool: ${BANKROLL_INITIAL_PRIZE_POOL:0.0000}
  catalog:
    # true = refuse to start when a case has RTP above 93%; false = only log a warning
    enforce-rtp-cap: ${ENFORCE_RTP_CAP:false}

app:
  deposit:
    admin-username: ${DEPOSIT_ADMIN_USERNAME:chromakid}
