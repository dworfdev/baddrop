# =============================================================================
# LOCAL TEST CONFIGURATION (In-Memory H2 Database for Local Dev & JUnit 5 Tests)
# =============================================================================
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: baddrop
  datasource:
    url: jdbc:h2:mem:slotsdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  web:
    resources:
      cache:
        period: 0
        cachecontrol:
          no-cache: true
          no-store: true
          must-revalidate: true

slots:
  admin:
    # Admin password: used by /api/users/promo and as the X-Admin-Key for /api/admin/**
    password: ${ADMIN_PASSWORD:admin_new}
  bankroll:
    initial-prize-pool: ${BANKROLL_INITIAL_PRIZE_POOL:0.0000}