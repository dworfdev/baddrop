# =============================================================================
# LOCAL TEST CONFIGURATION (In-Memory H2 Database for Local Dev & JUnit 5 Tests)
# JUnit tests inject their own admin credentials and limits from IntegrationTestBase.
# =============================================================================
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: baddrop
  datasource:
    url: jdbc:h2:mem:slotsdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  web:
    resources:
      cache:
        period: 0
        cachecontrol:
          no-cache: true
          no-store: true
          must-revalidate: true

slots:
  admin:
    # No default credentials on purpose. To use /admin-login.html locally, set these three env vars
    # (generate them with AdminCredentialsGenerator). JUnit tests do not need them.
    username: ${ADMIN_USERNAME:}
    password-hash: ${ADMIN_PASSWORD_HASH:}
    totp-secret: ${ADMIN_TOTP_SECRET:}
  cookie:
    # Local dev runs on plain http. JUnit tests force this back to true (see IntegrationTestBase).
    secure: false
  bankroll:
    initial-prize-pool: ${BANKROLL_INITIAL_PRIZE_POOL:0.0000}

app:
  deposit:
    admin-username: ${DEPOSIT_ADMIN_USERNAME:chromakid}
