# =============================================================================
# LOCAL TEST CONFIGURATION (In-Memory H2 Database for Local Dev & JUnit 5 Tests)
# =============================================================================
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: baddrop
  datasource:
    url: jdbc:h2:mem:slotsdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  web:
    resources:
      cache:
        period: 0
        cachecontrol:
          no-cache: true
          no-store: true
          must-revalidate: true

# Configurable Case Math & Dispersion Profiles (Target RTP: 93.00%, 0.00x Total Loss, 0.002 Jackpot)
slots:
  admin:
    password: ${ADMIN_PASSWORD:admin_new}
  bankroll:
    initial-prize-pool: ${BANKROLL_INITIAL_PRIZE_POOL:0.0000}
  cases:
    paytables:
      IRON_CRATE:
        - multiplier: 0.15
          probability: 0.200
          label: "Common Scrap (0.15x)"
        - multiplier: 0.50
          probability: 0.310
          label: "Low Return (0.50x)"
        - multiplier: 0.90
          probability: 0.230
          label: "Near Even (0.90x)"
        - multiplier: 1.50
          probability: 0.180
          label: "Small Win (1.50x)"
        - multiplier: 2.80
          probability: 0.060
          label: "Nice Win (2.80x)"
        - multiplier: 5.00
          probability: 0.020
          label: "Cap Prize (5.00x)"
      SILVER_CRATE:
        - multiplier: 0.10
          probability: 0.200
          label: "Common Scrap (0.10x)"
        - multiplier: 0.45
          probability: 0.340
          label: "Low Return (0.45x)"
        - multiplier: 0.85
          probability: 0.240
          label: "Near Even (0.85x)"
        - multiplier: 1.70
          probability: 0.140
          label: "Decent Win (1.70x)"
        - multiplier: 3.50
          probability: 0.070
          label: "Big Win (3.50x)"
        - multiplier: 7.00
          probability: 0.010
          label: "Cap Prize (7.00x)"
      GOLD_CRATE:
        - multiplier: 0.08
          probability: 0.300
          label: "Broken Junk (0.08x)"
        - multiplier: 0.40
          probability: 0.240
          label: "Low Return (0.40x)"
        - multiplier: 0.80
          probability: 0.250
          label: "Near Even (0.80x)"
        - multiplier: 2.00
